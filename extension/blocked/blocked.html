<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Time's up — SelfControl</title>
    <link rel="stylesheet" href="../common/theme.css" />
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <!-- One card for both states: blocked, and the moment it unlocks, which
         swaps the icon, the middle slot and the last line in place. -->
    <main class="card">
      <img class="state-icon" id="icon" src="../icons/blocked.svg" alt="" width="64" height="64" />

      <h1 id="headline">Time's up</h1>
      <p class="quip" id="quip"></p>

      <div class="meter" role="img" aria-labelledby="countdown-label">
        <div class="meter-fill" id="meter"></div>
      </div>

      <div class="slot" id="countdown-label">
        <span class="eyebrow" id="countdown-text">Unlocks in</span>
        <strong class="countdown" id="countdown">—</strong>
        <span class="pill ok unlocked-pill" id="unlocked" hidden>Unlocked</span>
      </div>

      <p class="stat usage" id="detail"></p>

      <p class="passes" id="passes" hidden>
        <img src="../icons/pass.svg" alt="" width="20" height="20" />
        <span id="passes-text"></span>
      </p>

      <p class="return" id="return" hidden></p>
    </main>

    <script src="blocked.js" type="module"></script>
  </body>
</html>
