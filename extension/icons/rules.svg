<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rules & Settings Dashboard Icon: Sliders & Timer in matching dark navy rounded squircle -->
  <rect width="64" height="64" rx="14" fill="#2b3a55"/>
  <!-- Extension stopwatch top button -->
  <rect x="26" y="8" width="12" height="5" rx="2.5" fill="#f5f7fa"/>
  <!-- Rolling window circle gear contour -->
  <circle cx="32" cy="34" r="16" fill="none" stroke="#f5f7fa" stroke-width="3" stroke-dasharray="8 3" opacity="0.5"/>
  <!-- Center adjustment sliders / mindful tuning levers -->
  <line x1="24" y1="27" x2="40" y2="27" stroke="#f5f7fa" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="27" r="3" fill="#e4572e"/>
  
  <line x1="24" y1="34" x2="40" y2="34" stroke="#f5f7fa" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="36" cy="34" r="3" fill="#f5f7fa"/>

  <line x1="24" y1="41" x2="40" y2="41" stroke="#f5f7fa" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="30" cy="41" r="3" fill="#10b981"/>
</svg>