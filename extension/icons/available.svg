<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Available Again / Unlocked Icon: Refilled clock / deliberate checkmark badge in matching dark navy rounded squircle -->
  <rect width="64" height="64" rx="14" fill="#2b3a55"/>
  <!-- Clock circle backdrop -->
  <circle cx="32" cy="34" r="17" fill="none" stroke="#f5f7fa" stroke-width="3.5" opacity="0.4"/>
  <!-- Replenished pie sector / progress ring in fresh emerald accent -->
  <path d="M32 34 L32 17 A17 17 0 1 1 20 46 Z" fill="#10b981" opacity="0.25"/>
