<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SelfControl — Rules</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header class="page-head">
      <h1>Rules</h1>
      <p class="lede">
        Each rule watches some domains and runs a clock while you are actually using them.
        Time is counted over a rolling window, so budget comes back gradually rather than
        resetting on the hour. A daily or weekly cap can sit on top of it.
      </p>
    </header>

    <ul class="rules" id="rules"></ul>

    <div class="transfer-panel" id="transfer" hidden>
      <p id="transfer-summary"></p>
      <div class="transfer-buttons">
        <button type="button" id="transfer-confirm" class="primary">Replace my rules</button>
        <button type="button" id="transfer-cancel" class="secondary">Cancel</button>
      </div>
    </div>

    <div class="actions">
      <button type="button" id="add" class="secondary">Add a rule</button>
      <button type="button" id="export" class="secondary">Export</button>
      <button type="button" id="import" class="secondary">Import</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden />
      <div class="spacer"></div>
      <output id="status" class="status" role="status"></output>
      <button type="button" id="save" class="primary">Save</button>
    </div>

    <footer class="version" id="version"></footer>

    <template id="rule-template">
      <li class="rule">
        <div class="rule-head">
          <input class="label-input" data-field="label" type="text" placeholder="Site name"
                 aria-label="Rule name" />
          <button type="button" class="delete" data-action="delete" aria-label="Delete rule">
            Delete
          </button>
        </div>

        <label class="field wide">
          <span>Domains</span>
          <input data-field="match" type="text" placeholder="youtube.com, vimeo.com" />
          <small>Subdomains are included. A pasted URL works too.</small>
        </label>

        <label class="field wide">
          <span>Count time</span>
          <select data-field="mode"></select>
        </label>

        <div class="grid">
          <label class="field">
            <span>Budget</span>
            <span class="with-unit">
              <input data-field="budgetMin" type="number" min="1" step="1" />
              <small>min</small>
            </span>
          </label>

          <label class="field">
            <span>Per rolling window</span>
            <span class="with-unit">
              <input data-field="windowMin" type="number" min="2" step="1" />
              <small>min</small>
            </span>
          </label>
        </div>

        <div class="grid">
          <label class="field">
            <span>Per day</span>
            <span class="with-unit">
              <input data-field="dailyMin" type="number" min="1" step="1" placeholder="none" />
              <small>min</small>
            </span>
          </label>

          <label class="field">
            <span>Per week</span>
            <span class="with-unit">
              <input data-field="weeklyMin" type="number" min="1" step="1" placeholder="none" />
              <small>min</small>
            </span>
          </label>
          <small class="grid-hint">
            Calendar caps on top of the rolling window: a day ends at local midnight, a week
            on Sunday night. Leave blank for none.
          </small>
        </div>

        <label class="field wide">
          <span>When it runs out</span>
          <select data-field="onExceed"></select>
        </label>

        <label class="field wide">
          <span>Stay blocked until this much is free again</span>
          <span class="with-unit">
            <input data-field="unlockMin" type="number" min="0" step="1" />
            <small>min</small>
          </span>
          <small>
            0 unblocks the moment any time frees up, which on a rolling window means a
            minute at a time. Set it higher to come back in usable chunks.
          </small>
        </label>

        <div class="grid">
          <label class="field">
            <span>Passes per week</span>
            <input data-field="passesPerWeek" type="number" min="0" step="1" />
          </label>

          <label class="field">
            <span>Pass length</span>
            <span class="with-unit">
              <input data-field="passMin" type="number" min="1" step="1" />
              <small>min</small>
            </span>
          </label>

          <label class="check grid-hint">
            <input data-field="passCounts" type="checkbox" />
            <span>Pass time counts toward the daily and weekly caps</span>
          </label>
          <small class="grid-hint">
            A pass suspends the rolling window for one long session, for the video that is
            longer than the window allows. The time still goes into the window afterwards,
            so a pass is followed by the usual cool-down. 0 passes disables them.
          </small>
        </div>

        <ul class="errors" data-role="errors" hidden></ul>

        <details class="history" data-role="history">
          <summary>
            <span>History</span>
            <span class="history-totals" data-role="history-totals"></span>
          </summary>
          <div class="history-body" data-role="history-body"></div>
        </details>
      </li>
    </template>

    <script src="options.js" type="module"></script>
  </body>
</html>
