name: release

# Tag a version to ship it:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Signs with AMO, attaches the signed .xpi to a GitHub Release, and publishes a
# regenerated updates.json to GitHub Pages. Installed copies pick it up on their
# next update check.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the .xpi
  pages: write # publish updates.json
  id-token: write # required by deploy-pages

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      # Everything downstream names the release after the ref. Run from a
      # branch and we would publish a release called "main" with download URLs
      # that go nowhere. workflow_dispatch can target a tag — pick one there.
      - name: Must be run from a tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::run this from a v* tag, not $GITHUB_REF_NAME"
            exit 1
          fi

      # The tag is the source of truth for humans, the manifest for Firefox.
      # If they disagree, updates.json would advertise a version nobody can
      # download — so fail here rather than ship that.
      - name: Tag must match the manifest version
        run: |
          manifest_version="$(node -p 'require("./extension/manifest.json").version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi
          echo "version=$manifest_version" >> "$GITHUB_ENV"

      - name: Verify
        run: |
          nix develop --command node --test
          nix develop --command web-ext lint

      # Channel is "unlisted" via web-ext-config.mjs. AMO permanently rejects a
      # version it has already seen, so this is where a forgotten bump fails.
      - name: Sign with AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: nix develop --command web-ext sign

      - name: Locate the signed .xpi
        id: xpi
        run: |
          path="$(ls web-ext-artifacts/*.xpi | head -1)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$path")" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.xpi.outputs.path }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "${{ steps.xpi.outputs.path }}" --clobber

      - name: Generate updates.json
        run: |
          nix develop --command node tools/make-updates-json.mjs \
            "${{ steps.xpi.outputs.path }}" \
            "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${{ steps.xpi.outputs.name }}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
